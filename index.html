<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PadelMatch v3</title>

<link
rel="manifest"
href="manifest.json">

<meta
name="theme-color"
content="#1f4e79">

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:15px;
margin:0;
}

.logo{
display:block;
margin:auto;
width:180px;
max-width:80%;
margin-bottom:10px;
}

h1{
text-align:center;
color:#1f4e79;
margin-top:5px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
}

input,
select{
padding:8px;
margin:5px 0;
width:100%;
box-sizing:border-box;
}

button{
padding:10px 14px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;
margin:3px;
}

.btn{
background:#1f4e79;
}

.btn-danger{
background:#d9534f;
}

.btn-success{
background:#198754;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th{
background:#1f4e79;
color:white;
}

td,
th{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.partido{
border:1px solid #ddd;
border-radius:8px;
padding:10px;
margin-top:10px;
}

.descanso{
background:#fff3cd;
border:1px solid #ffe69c;
padding:10px;
border-radius:8px;
margin-bottom:10px;
}

li{
margin-bottom:5px;
}

.acciones{
display:flex;
flex-wrap:wrap;
gap:5px;
}

@media(max-width:600px){

button{
width:100%;
}

}

</style>

</head>

<body>

<div style="text-align:center;">

<img
src="logo-512.png"
alt="PadelMatch"
class="logo">

<h1>🎾 PadelMatch</h1>

</div>

<div class="card">

<h3>Modalidad de Torneo</h3>

<select id="modalidad">

<option value="aleatoria">
🎲 Parejas Aleatorias
</option>

<option value="fija">
👥 Parejas Fijas
</option>

</select>

</div>

<div
class="card"
id="panelJugadores">

<h3>Agregar Jugador</h3>

<input
type="text"
id="nombreJugador"
placeholder="Nombre del jugador">

<button
class="btn"
onclick="agregarJugador()">

Agregar Jugador

</button>

<ul id="listaJugadores"></ul>

</div>

<div
class="card"
id="panelParejasFijas"
style="display:none;">

<h3>👥 Registrar Pareja</h3>

<input
type="text"
id="jugador1"
placeholder="Jugador 1">

<input
type="text"
id="jugador2"
placeholder="Jugador 2">

<button
class="btn"
onclick="agregarPareja()">

➕ Agregar Pareja

</button>

<ul id="listaParejas"></ul>

</div>

<div class="card">

<div class="acciones">

<button
class="btn"
onclick="generarRonda()">

🎾 Generar Ronda

</button>

<button
class="btn-success"
onclick="finalizarTorneo()">

🏆 Finalizar Torneo

</button>

<button
class="btn-danger"
onclick="resetTorneo()">

🗑️ Reset Torneo

</button>

</div>

</div>

<div class="card">

<h3>Rondas</h3>

<div id="partidos"></div>

</div>

<div class="card">

<h3>Clasificación General</h3>

<table>

<thead>

<tr>

<th>#</th>

<th>Jugador / Pareja</th>

<th>PTS</th>

<th>DIF</th>

</tr>

</thead>

<tbody id="tablaGeneral">
</tbody>

</table>

</div>

<script>

let jugadores =
JSON.parse(
localStorage.getItem(
"padelJugadores"
)
) || [];

let parejasFijas =
JSON.parse(
localStorage.getItem(
"padelParejasFijas"
)
) || [];

let rondaActual =
parseInt(
localStorage.getItem(
"padelRonda"
)
) || 1;

let historialParejas =
JSON.parse(
localStorage.getItem(
"padelParejas"
)
) || [];

let modalidad =
localStorage.getItem(
"padelModalidad"
)
|| "aleatoria";

function guardarDatos(){

localStorage.setItem(
"padelJugadores",
JSON.stringify(jugadores)
);

localStorage.setItem(
"padelParejasFijas",
JSON.stringify(parejasFijas)
);

localStorage.setItem(
"padelRonda",
rondaActual
);

localStorage.setItem(
"padelParejas",
JSON.stringify(historialParejas)
);

localStorage.setItem(
"padelModalidad",
modalidad
);

}

function cambiarModo(){

modalidad =
document.getElementById(
"modalidad"
).value;

guardarDatos();

if(
modalidad==="fija"
){

document.getElementById(
"panelParejasFijas"
).style.display =
"block";

document.getElementById(
"panelJugadores"
).style.display =
"none";

}
else{

document.getElementById(
"panelParejasFijas"
).style.display =
"none";

document.getElementById(
"panelJugadores"
).style.display =
"block";

}

actualizarTabla();

}

document.getElementById(
"modalidad"
).value =
modalidad;

document.getElementById(
"modalidad"
).addEventListener(
"change",
cambiarModo
);

function agregarJugador(){

let nombre =
document.getElementById(
"nombreJugador"
).value.trim();

if(nombre===""){
return;
}

if(jugadores.length>=16){

alert(
"Máximo 16 jugadores"
);

return;

}

jugadores.push({

nombre:nombre,

puntos:0,

juegosFavor:0,

juegosContra:0,

descansos:0,

ultimoDescanso:false

});

guardarDatos();

mostrarJugadores();

actualizarTabla();

document.getElementById(
"nombreJugador"
).value="";

}

function agregarPareja(){

let jugador1 =
document.getElementById(
"jugador1"
).value.trim();

let jugador2 =
document.getElementById(
"jugador2"
).value.trim();

if(
jugador1==="" ||
jugador2===""
){
return;
}

parejasFijas.push({

nombre:
jugador1 +
" / " +
jugador2,

puntos:0,

juegosFavor:0,

juegosContra:0,

descansos:0,

ultimoDescanso:false

});

guardarDatos();

mostrarParejas();

actualizarTabla();

document.getElementById(
"jugador1"
).value="";

document.getElementById(
"jugador2"
).value="";

}

function mostrarJugadores(){

let lista =
document.getElementById(
"listaJugadores"
);

lista.innerHTML="";

jugadores.forEach(
(j,index)=>{

let li =
document.createElement("li");

li.innerText =

(index+1) +
". " +
j.nombre;

lista.appendChild(li);

}
);

}

function mostrarParejas(){

let lista =
document.getElementById(
"listaParejas"
);

lista.innerHTML="";

parejasFijas.forEach(
(p,index)=>{

let li =
document.createElement("li");

li.innerText =

(index+1) +
". " +
p.nombre;

lista.appendChild(li);

}
);

}

function buscar(nombre){

return jugadores.find(
j=>j.nombre===nombre
);

}

function parejaExiste(a,b){

let clave =
[a,b]
.sort()
.join("|");

return historialParejas.includes(
clave
);

}

function registrarPareja(a,b){

let clave =
[a,b]
.sort()
.join("|");

if(
!historialParejas.includes(
clave
)
){

historialParejas.push(
clave
);

}

}

function finalizarTorneo(){

let fuente =

modalidad==="fija"
? [...parejasFijas]
: [...jugadores];

fuente.sort((a,b)=>{

if(
b.puntos !== a.puntos
){
return (
b.puntos -
a.puntos
);
}

let difA =
a.juegosFavor -
a.juegosContra;

let difB =
b.juegosFavor -
b.juegosContra;

return difB - difA;

});

let mensaje =

"🏆 RESULTADOS FINALES 🏆\n\n";

fuente.forEach(
(item,index)=>{

let puesto =
(index+1);

if(index===0){
puesto="🥇";
}
else if(index===1){
puesto="🥈";
}
else if(index===2){
puesto="🥉";
}

let dif =

item.juegosFavor -
item.juegosContra;

mensaje +=

puesto +
" " +
item.nombre +
"\nPTS: " +
item.puntos +
" | DIF: " +
dif +
"\n\n";

}
);

alert(mensaje);

}

cambiarModo();

mostrarJugadores();

mostrarParejas();
function generarRonda(){

if(
modalidad==="fija"
){

generarRondaFija();
return;

}

generarRondaAleatoria();

}

function generarRondaAleatoria(){

if(
jugadores.length < 4
){

alert(
"Mínimo 4 jugadores"
);

return;

}

let orden =
[...jugadores];

orden.sort((a,b)=>{

if(
a.descansos !==
b.descansos
){

return (
a.descansos -
b.descansos
);

}

return Math.random()-0.5;

});

let sobrantes =
orden.length % 4;

let candidatos =
orden.filter(
j=>!j.ultimoDescanso
);

if(
candidatos.length <
sobrantes
){

candidatos =
[...orden];

}

let descansan =
candidatos.slice(
0,
sobrantes
);

jugadores.forEach(j=>{

j.ultimoDescanso =
false;

});

descansan.forEach(j=>{

j.descansos++;

j.puntos += 1;

j.ultimoDescanso =
true;

});

let activos =
orden.filter(
j=>!descansan.includes(j)
);

activos.sort(
()=>Math.random()-0.5
);

let activosFinal = [];

let disponibles =
[...activos];

while(
disponibles.length >= 2
){

let jugador1 =
disponibles.shift();

let indice =
disponibles.findIndex(
j=>
!parejaExiste(
jugador1.nombre,
j.nombre
)
);

if(
indice===-1
){
indice=0;
}

let jugador2 =
disponibles.splice(
indice,
1
)[0];

registrarPareja(
jugador1.nombre,
jugador2.nombre
);

activosFinal.push(
jugador1
);

activosFinal.push(
jugador2
);

}

let bloque =
document.createElement(
"div"
);

bloque.className =
"card";

bloque.innerHTML =

"<h4>Ronda " +
rondaActual +
"</h4>";

if(
descansan.length > 0
){

bloque.innerHTML +=

'<div class="descanso"><b>Descansan:</b><br>' +

descansan.map(
x=>x.nombre
).join("<br>")

+

'<br><br>+1 punto por descanso</div>';

}

for(
let i=0;
i+3<activosFinal.length;
i+=4
){

let a =
activosFinal[i];

let b =
activosFinal[i+1];

let c =
activosFinal[i+2];

let d =
activosFinal[i+3];

let id =
"r" +
rondaActual +
"_" +
i;

let partido =
document.createElement(
"div"
);

partido.className =
"partido";

partido.innerHTML =

`
<b>${a.nombre} / ${b.nombre}</b>

<br>VS<br>

<b>${c.nombre} / ${d.nombre}</b>

<br><br>

<input
type="number"
min="0"
value="0"
id="a_${id}">

<input
type="number"
min="0"
value="0"
id="b_${id}">

<button
class="btn"
onclick="guardarResultado(
'${a.nombre}',
'${b.nombre}',
'${c.nombre}',
'${d.nombre}',
'a_${id}',
'b_${id}',
this
)">
Guardar
</button>
`;

bloque.appendChild(
partido
);

}

document.getElementById(
"partidos"
).prepend(
bloque
);

rondaActual++;

guardarDatos();

actualizarTabla();

}

function generarRondaFija(){

if(
parejasFijas.length < 2
){

alert(
"Mínimo 2 parejas"
);

return;

}

let parejas =
[...parejasFijas];

parejas.sort(
()=>Math.random()-0.5
);

let sobrantes =
parejas.length % 2;

let descansan =
parejas.slice(
0,
sobrantes
);

descansan.forEach(p=>{

p.descansos++;

p.puntos += 1;

});

let activas =
parejas.filter(
p=>!descansan.includes(p)
);

let bloque =
document.createElement(
"div"
);

bloque.className =
"card";

bloque.innerHTML =

"<h4>Ronda " +
rondaActual +
"</h4>";

if(
descansan.length > 0
){

bloque.innerHTML +=

'<div class="descanso"><b>Descansa:</b><br>' +

descansan.map(
x=>x.nombre
).join("<br>")

+

'<br><br>+1 punto por descanso</div>';

}

for(
let i=0;
i+1<activas.length;
i+=2
){

let parejaA =
activas[i];

let parejaB =
activas[i+1];

let id =
"pf_" +
rondaActual +
"_" +
i;

let partido =
document.createElement(
"div"
);

partido.className =
"partido";

partido.innerHTML =

`
<b>${parejaA.nombre}</b>

<br>VS<br>

<b>${parejaB.nombre}</b>

<br><br>

<input
type="number"
min="0"
value="0"
id="a_${id}">

<input
type="number"
min="0"
value="0"
id="b_${id}">

<button
class="btn"
onclick="
guardarResultadoParejas(
'${parejaA.nombre}',
'${parejaB.nombre}',
'a_${id}',
'b_${id}',
this
)
">
Guardar
</button>
`;

bloque.appendChild(
partido
);

}

document.getElementById(
"partidos"
).prepend(
bloque
);

rondaActual++;

guardarDatos();

actualizarTabla();

}
function guardarResultado(
a,
b,
c,
d,
id1,
id2,
btn
){

let p1 =
parseInt(
document.getElementById(id1).value
);

let p2 =
parseInt(
document.getElementById(id2).value
);

if(
isNaN(p1) ||
isNaN(p2)
){
alert(
"Captura ambos marcadores"
);
return;
}

let j1 =
buscar(a);

let j2 =
buscar(b);

let j3 =
buscar(c);

let j4 =
buscar(d);

[j1,j2].forEach(j=>{

j.puntos += p1;
j.juegosFavor += p1;
j.juegosContra += p2;

});

[j3,j4].forEach(j=>{

j.puntos += p2;
j.juegosFavor += p2;
j.juegosContra += p1;

});

btn.disabled = true;
btn.innerText = "Guardado";

guardarDatos();

actualizarTabla();

}

function guardarResultadoParejas(
nombreA,
nombreB,
id1,
id2,
btn
){

let p1 =
parseInt(
document.getElementById(id1).value
);

let p2 =
parseInt(
document.getElementById(id2).value
);

if(
isNaN(p1) ||
isNaN(p2)
){
alert(
"Captura ambos marcadores"
);
return;
}

let parejaA =
parejasFijas.find(
p=>p.nombre===nombreA
);

let parejaB =
parejasFijas.find(
p=>p.nombre===nombreB
);

parejaA.puntos += p1;
parejaA.juegosFavor += p1;
parejaA.juegosContra += p2;

parejaB.puntos += p2;
parejaB.juegosFavor += p2;
parejaB.juegosContra += p1;

btn.disabled = true;
btn.innerText = "Guardado";

guardarDatos();

actualizarTabla();

}

function actualizarTabla(){

let tabla =
document.getElementById(
"tablaGeneral"
);

tabla.innerHTML = "";

let fuente =

modalidad==="fija"
? [...parejasFijas]
: [...jugadores];

fuente.sort((a,b)=>{

if(
b.puntos !== a.puntos
){
return b.puntos - a.puntos;
}

let difA =
a.juegosFavor -
a.juegosContra;

let difB =
b.juegosFavor -
b.juegosContra;

return difB - difA;

});

fuente.forEach(
(item,index)=>{

let fila =
document.createElement(
"tr"
);

let dif =

item.juegosFavor -
item.juegosContra;

let puesto =
(index + 1);

if(index===0){
puesto="🥇";
}
else if(index===1){
puesto="🥈";
}
else if(index===2){
puesto="🥉";
}

fila.innerHTML =
`
<td>${puesto}</td>
<td>${item.nombre}</td>
<td>${item.puntos}</td>
<td>${dif}</td>
`;

tabla.appendChild(
fila
);

}
);

}

function resetTorneo(){

if(
confirm(
"¿Eliminar todo el torneo?"
)
){

localStorage.clear();

jugadores = [];

parejasFijas = [];

historialParejas = [];

rondaActual = 1;

document.getElementById(
"partidos"
).innerHTML = "";

mostrarJugadores();

mostrarParejas();

actualizarTabla();

}

}

mostrarJugadores();

mostrarParejas();

actualizarTabla();

if(
"serviceWorker" in navigator
){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker.register(
"./service-worker.js"
)
.then(()=>{

console.log(
"Service Worker registrado"
);

})
.catch(error=>{

console.log(
error
);

});

}
);

}

</script>

</body>

</html>
