<!DOCTYPE html>
<html lang="es">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Torneo Pádel</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1f4e79">


<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:15px;
}

h1{
text-align:center;
color:#1f4e79;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
}

input{
padding:8px;
margin:5px;
}

button{
padding:8px 12px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;
}

.btn{
background:#1f4e79;
}

.btn-danger{
background:#d9534f;
}

.btn-success{
background:#198754;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1f4e79;
color:white;
}

td,th{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.partido{
border:1px solid #ddd;
border-radius:8px;
padding:10px;
margin-top:10px;
}

.descanso{
background:#fff3cd;
border:1px solid #ffe69c;
padding:10px;
border-radius:8px;
margin-bottom:10px;
}

</style>

</head>

<body>

<h1>🎾 Torneo Pádel</h1>

<div class="card">

<h3>Agregar jugador</h3>

<input
type="text"
id="nombreJugador"
placeholder="Nombre jugador">

<button
class="btn"
onclick="agregarJugador()">
Agregar
</button>

<ul id="listaJugadores"></ul>

</div>

<div class="card">

<button
class="btn"
onclick="generarRonda()">
Generar Ronda
</button>

<button
class="btn-success"
onclick="finalizarTorneo()">
🏆 Finalizar Torneo
</button>

<button
class="btn-danger"
onclick="resetTorneo()">
Reset Torneo
</button>

</div>

<div class="card">

<h3>Rondas</h3>

<div id="partidos"></div>

</div>

<div class="card">

<h3>Clasificación General</h3>

<table>

<thead>
<tr>
<th>#</th>
<th>Jugador</th>
<th>PTS</th>
<th>DIF</th>
</tr>
</thead>

<tbody id="tablaGeneral"></tbody>

</table>

</div>

<script>

let jugadores =
JSON.parse(
localStorage.getItem(
"padelJugadores"
)
) || [];

let rondaActual =
parseInt(
localStorage.getItem(
"padelRonda"
)
) || 1;

let historialParejas =
JSON.parse(
localStorage.getItem(
"padelParejas"
)
) || [];

function guardarDatos(){

localStorage.setItem(
"padelJugadores",
JSON.stringify(jugadores)
);

localStorage.setItem(
"padelRonda",
rondaActual
);

localStorage.setItem(
"padelParejas",
JSON.stringify(historialParejas)
);

}

function agregarJugador(){

let nombre =
document.getElementById(
"nombreJugador"
).value.trim();

if(nombre===""){
return;
}

if(jugadores.length>=16){

alert("Máximo 16 jugadores");
return;

}

jugadores.push({

nombre:nombre,
puntos:0,
juegosFavor:0,
juegosContra:0,
descansos:0,
ultimoDescanso:false

});


guardarDatos();

mostrarJugadores();

actualizarTabla();

document.getElementById(
"nombreJugador"
).value="";

}

function mostrarJugadores(){

let lista =
document.getElementById(
"listaJugadores"
);

lista.innerHTML="";

jugadores.forEach(j=>{

let li =
document.createElement("li");

li.innerText =
j.nombre;

lista.appendChild(li);

});

}

function buscar(nombre){

return jugadores.find(
j=>j.nombre===nombre
);

}

function parejaExiste(a,b){

let clave =
[a,b]
.sort()
.join("|");

return historialParejas.includes(clave);

}

function registrarPareja(a,b){

let clave =
[a,b]
.sort()
.join("|");

if(
!historialParejas.includes(clave)
){

historialParejas.push(clave);

}

}

function finalizarTorneo(){

let ordenados =
[...jugadores];

ordenados.sort((a,b)=>{

if(
b.puntos !== a.puntos
){
return b.puntos - a.puntos;
}

let difA =
a.juegosFavor -
a.juegosContra;

let difB =
b.juegosFavor -
b.juegosContra;

return difB - difA;

});

let mensaje =
"🏆 RESULTADOS FINALES 🏆\n\n";

ordenados.forEach((j,index)=>{

let puesto =
(index + 1);

if(index===0){
puesto="🥇";
}
else if(index===1){
puesto="🥈";
}
else if(index===2){
puesto="🥉";
}

mensaje +=
puesto +
" " +
j.nombre +
" - " +
j.puntos +
" pts\n";

});

alert(mensaje);

}

function generarRonda(){

if(jugadores.length < 4){

alert("Mínimo 4 jugadores");
return;

}

let orden =
[...jugadores];

orden.sort((a,b)=>{

if(
a.descansos !==
b.descansos
){

return a.descansos -
b.descansos;

}

return Math.random()-0.5;

});

let sobrantes =
orden.length % 4;

let candidatos =
orden.filter(
j=>!j.ultimoDescanso
);

if(
candidatos.length < sobrantes
){
candidatos = [...orden];
}

let descansan =
candidatos.slice(
0,
sobrantes
);

jugadores.forEach(j=>{

j.ultimoDescanso = false;

});

descansan.forEach(j=>{

j.descansos++;
j.puntos += 1;
j.ultimoDescanso = true;

});

let activos =
orden.slice(sobrantes);

activos.sort(
()=>Math.random()-0.5
);

let activosFinal = [];

let disponibles =
[...activos];

while(
disponibles.length >= 2
){

let jugador1 =
disponibles.shift();

let indice =
disponibles.findIndex(
j=>
!parejaExiste(
jugador1.nombre,
j.nombre
)
);

if(indice === -1){

indice = 0;

}

let jugador2 =
disponibles.splice(
indice,
1
)[0];

registrarPareja(
jugador1.nombre,
jugador2.nombre
);

activosFinal.push(
jugador1
);

activosFinal.push(
jugador2
);

}

let bloque =
document.createElement("div");

bloque.className =
"card";

bloque.innerHTML =
"<h4>Ronda " +
rondaActual +
"</h4>";

if(descansan.length > 0){

bloque.innerHTML +=

'<div class="descanso"><b>Descansan:</b><br>' +

descansan.map(
x=>x.nombre
).join("<br>")

+

'<br><br>+1 punto por descanso</div>';

}

for(
let i=0;
i+3<activosFinal.length;
i+=4
){

let a =
activosFinal[i];

let b =
activosFinal[i+1];

let c =
activosFinal[i+2];

let d =
activosFinal[i+3];

let id =
"r" +
rondaActual +
"_" +
i;

let partido =
document.createElement("div");

partido.className =
"partido";

partido.innerHTML =

`
<b>${a.nombre} / ${b.nombre}</b>

<br>VS<br>

<b>${c.nombre} / ${d.nombre}</b>

<br><br>

<input
type="number"
value="0"
id="a_${id}">

<input
type="number"
value="0"
id="b_${id}">

<button
class="btn"
onclick="guardarResultado(
'${a.nombre}',
'${b.nombre}',
'${c.nombre}',
'${d.nombre}',
'a_${id}',
'b_${id}',
this
)">
Guardar
</button>
`;

bloque.appendChild(
partido
);

}

document.getElementById(
"partidos"
).prepend(
bloque
);

rondaActual++;

guardarDatos();

actualizarTabla();

}

function guardarResultado(
a,b,c,d,id1,id2,btn
){

let p1 =
parseInt(
document.getElementById(id1).value
);

let p2 =
parseInt(
document.getElementById(id2).value
);

if(
isNaN(p1) ||
isNaN(p2)
){
alert(
"Captura ambos marcadores"
);
return;
}

let j1 = buscar(a);
let j2 = buscar(b);
let j3 = buscar(c);
let j4 = buscar(d);

[j1,j2].forEach(j=>{

j.puntos += p1;
j.juegosFavor += p1;
j.juegosContra += p2;

});

[j3,j4].forEach(j=>{

j.puntos += p2;
j.juegosFavor += p2;
j.juegosContra += p1;

});

btn.disabled = true;
btn.innerText = "Guardado";

guardarDatos();

actualizarTabla();

}

function actualizarTabla(){

let tabla =
document.getElementById(
"tablaGeneral"
);

tabla.innerHTML="";

let ordenados =
[...jugadores];

ordenados.sort((a,b)=>{

if(
b.puntos !== a.puntos
){
return b.puntos - a.puntos;
}

let difA =
a.juegosFavor -
a.juegosContra;

let difB =
b.juegosFavor -
b.juegosContra;

return difB - difA;

});

ordenados.forEach((j,index)=>{

let fila =
document.createElement("tr");

let dif =
j.juegosFavor -
j.juegosContra;

let puesto =
index + 1;

if(index===0){
puesto = "🥇";
}
else if(index===1){
puesto = "🥈";
}
else if(index===2){
puesto = "🥉";
}

fila.innerHTML =
`
<td>${puesto}</td>
<td>${j.nombre}</td>
<td>${j.puntos}</td>
<td>${dif}</td>
`;

tabla.appendChild(fila);

});

}

function resetTorneo(){

if(
confirm(
"¿Eliminar todo el torneo?"
)
){

localStorage.clear();

jugadores = [];
historialParejas = [];
rondaActual = 1;

document.getElementById(
"partidos"
).innerHTML = "";

mostrarJugadores();
actualizarTabla();

}

}

mostrarJugadores();
actualizarTabla();

if ("serviceWorker" in navigator) {

window.addEventListener("load", () => {

navigator.serviceWorker.register(
"./service-worker.js"
);

});

}

</script>

</body>

</html>
